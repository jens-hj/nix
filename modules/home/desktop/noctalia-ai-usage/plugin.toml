id = "jens/ai-usage"
name = "AI Usage"
version = "0.1.0"
author = "jens"
license = "MIT"
description = "Remaining quota for Claude Code and Codex, per rolling window."
tags = ["bar", "monitoring"]
# 22 is the lowest level that has module require(), which is the newest host
# feature this plugin uses. Declaring the minimum rather than the current level
# keeps it loadable on older noctalia builds.
plugin_api = 22

[[widget]]
id = "usage"
entry = "widget.luau"

[[panel]]
id = "detail"
entry = "panel.luau"
width = 340
height = 320
